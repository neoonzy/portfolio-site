name: Assemble exhibition experience
on:
  push:
    branches:
      - feat/experiencia-arquivo-vivo
    paths:
      - .experience-source/READY
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore readable source
        run: |
          set -euo pipefail
          base64 -d .experience-source/ExhibitionApp.jsx.gz.b64 | gzip -d > src/ExhibitionApp.jsx
          base64 -d .experience-source/exhibition.css.gz.b64 | gzip -d > src/styles/exhibition.css
          sed -i "s#import App from './App.jsx'#import App from './ExhibitionApp.jsx'#" src/main.jsx
          printf "\nimport './styles/exhibition.css'\n" >> src/main.jsx
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/ExhibitionApp.jsx src/styles/exhibition.css src/main.jsx
          git commit -m "feat: new five-station nonlinear exhibition experience"
          git push origin HEAD:feat/experiencia-arquivo-vivo

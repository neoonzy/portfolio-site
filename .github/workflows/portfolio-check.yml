name: Portfolio checks

on:
  push:
    branches:
      - feat/oficina-editorial-interativa
      - feat/arquivo-fotografico-autoral
  pull_request:
    branches:
      - main
      - feat/oficina-editorial-interativa

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

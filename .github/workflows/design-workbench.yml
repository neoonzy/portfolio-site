name: Design workbench archive
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/ux-audit-complete-revision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source for local design verification
        run: |
          zip -qr design-workbench.zip . -x '.git/*' 'node_modules/*' '.playwright-cli/*' 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: design-workbench-source
          path: design-workbench.zip
          retention-days: 3
